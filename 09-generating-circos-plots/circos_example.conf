karyotype = {path/to/karyotype.txt}
<<include etc/housekeeping.conf>>
<<include etc/colors_fonts_patterns.conf>>

<image>

image_size = 1600p

</image>

<ideogram>
	# Ideogram position, fill and outline
	radius = 0.75r
	thickness = 40p
	fill = yes
	fill_color = black
	stroke_thickness = 1p
	stroke_color = black
		<spacing>
			default = 0.005r
		</spacing>
		
</ideogram>

show_label = yes
label_font = bold
label_radius   = 0.2r
label_center = yes
label_size = 48

show_ticks = yes
show_tick_labels = yes

<ticks>
	radius = 1.01r
	color = black

		<tick>
			# Major tick marks
			spacing = 200000u
			size = 45p
			thickness = 5p
			show_label = yes
			label_font = bold
			label_size = 40p
			label_offset = 10p
			multiplier = 0.001
			format = %.0f kb
		</tick>

		<tick>
			# Minor tick marks
			spacing = 100000u
			size = 35
			thickness = 5p
		</tick>

</ticks>

<image>
<<include etc/image.conf>>
</image>

# Density histograms
<plots>
	
	# Plotting density histogram 1
	<plot>
		type = histogram
		file = {path/to/denisty.txt} # provide the path to a density.txt file generated from bin_modification.py
		r1 = 0.98r # location of the outer radius in the plot
		r0 = 0.78r # location of the inner radius in the plot
		thickness = 5p
		color = blue # change the color here 
		min = 0 # minimum y-value
		max = 25 # maximum y-value

			# Formatting the axis
			<axes>
				# minimum y-value axis
				<axis>
					position = 0r
					color = black
					thickness = 5p
				</axis>
				# horizontal line demarcating 25% maximum y-value
				<axis>
					position = 0.25r
					color = lgrey
					thickness = 3p
				</axis>
				# horizontal line demarcating 50% maximum y-value
				<axis>
					position = 0.5r
					color = lgrey
					thickness = 3p
				</axis>
				# horizontal line demarcating 75%  maximum y-value
				<axis>
					position = 0.75r
					color = lgrey
					thickness = 3p
				</axis>
				# maximum y-value axis
				<axis>
					position = 1r
					color = black
					thickness = 5p
				</axis>
			</axes>

	</plot>
	# This sequence of code can be repeated to plot other density histograms concentrically

	# Plotting density histogram 2
