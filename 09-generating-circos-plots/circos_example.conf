					thickness = 5p
				</axis>
				# horizontal line demarcating 25% maximum y-value
				<axis>
					position = 0.25r
					color = lgrey
					thickness = 3p
				</axis>
				# horizontal line demarcating 50% maximum y-value
				<axis>
					position = 0.5r
					color = lgrey
					thickness = 3p
				</axis>
				# horizontal line demarcating 25% maximum y-value
				<axis>
					position = 0.75r
					color = lgrey
					thickness = 3p
				</axis>
				# maximum y-value
				<axis>
					position = 1r
					color = black
