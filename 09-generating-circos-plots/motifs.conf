karyotype = data/karyotype.txt
<<include etc/housekeeping.conf>>
<<include etc/colors_fonts_patterns.conf>>

<image>

image_size = 1600p

</image>

<ideogram>
	# Ideogram position, fill and outline
	radius = 0.75r
	thickness = 40p
	fill = yes
	fill_color = black
	stroke_thickness = 1p
	stroke_color = black
		<spacing>
			default = 0.005r
		</spacing>
		
</ideogram>

show_label = yes
label_font = bold
label_radius   = 0.2r
label_center = yes
label_size = 48

show_ticks = yes
show_tick_labels = yes

<ticks>
	radius = 1.01r
	color = black

		<tick>
			# Major tick marks
			spacing = 200000u
			size = 45p
			thickness = 5p
			show_label = yes
			label_font = bold
			label_size = 40p
			label_offset = 10p
			multiplier = 0.001
			format = %.0f kb
		</tick>

		<tick>
			# Minor tick marks
			spacing = 100000u
			size = 35
			thickness = 5p
		</tick>

</ticks>

<image>
<<include etc/image.conf>>
</image>

<plots>
	<plot>
		type = histogram
		file = data/UA159_GATC_methylation_density.txt
		r1 = 0.98r
		r0 = 0.78r
		thickness = 5p
		color = blue
		min = 0
		max = 25
			<axes>
				<axis>
					position = 0r
					color = black
					thickness = 5p
				</axis>
				<axis>
					position = 0.25r
					color = lgrey
					thickness = 3p
				</axis>
				<axis>
					position = 0.5r
					color = lgrey
					thickness = 3p
				</axis>
				<axis>
					position = 0.75r
					color = lgrey
					thickness = 3p
				</axis>
				<axis>
					position = 1r
					color = black
					thickness = 5p
				</axis>
			</axes>

	</plot>
	<plot>
		type = histogram
